{% extends "base.html" %}

{% block title %}Регистрация — Дневник путешествий{% endblock %}

{% block content %}
<div class="page-header" style="text-align:center;">
    <h1>Регистрация</h1>
    <p>Создайте аккаунт, чтобы делиться своими путешествиями</p>
</div>

<div class="form-card auth-form">
    <form method="POST" action="{{ url_for('register') }}">
        <div class="form-group">
            <label for="username">Имя пользователя</label>
            <input type="text" id="username" name="username"
                   value="{{ username|default('') }}"
                   placeholder="Минимум 3 символа" required minlength="3">
        </div>

        <div class="form-group">
            <label for="email">Электронная почта</label>
            <input type="email" id="email" name="email"
                   value="{{ email|default('') }}"
                   placeholder="example@mail.ru" required>
        </div>

        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password"
                   placeholder="Минимум 6 символов" required minlength="6">
        </div>

        <div class="form-group">
            <label for="password_confirm">Повторите пароль</label>
            <input type="password" id="password_confirm" name="password_confirm"
                   placeholder="Введите пароль ещё раз" required>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary" style="width:100%;">
                Зарегистрироваться
            </button>
        </div>
    </form>

    <p style="text-align:center; margin-top:1.25rem; font-size:0.9rem; color:var(--text-light);">
        Уже есть аккаунт?
        <a href="{{ url_for('login') }}">Войти</a>
    </p>
</div>
{% endblock %}
