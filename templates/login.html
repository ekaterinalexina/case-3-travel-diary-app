{% extends "base.html" %}

{% block title %}Вход — Дневник путешествий{% endblock %}

{% block content %}
<div class="page-header" style="text-align:center;">
    <h1>Вход в систему</h1>
    <p>Войдите, чтобы управлять своими путешествиями</p>
</div>

<div class="form-card auth-form">
    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
            <label for="username">Имя пользователя</label>
            <input type="text" id="username" name="username"
                   value="{{ username|default('') }}"
                   placeholder="Введите имя пользователя" required>
        </div>

        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password"
                   placeholder="Введите пароль" required>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary" style="width:100%;">
                Войти
            </button>
        </div>
    </form>

    <p style="text-align:center; margin-top:1.25rem; font-size:0.9rem; color:var(--text-light);">
        Нет аккаунта?
        <a href="{{ url_for('register') }}">Зарегистрироваться</a>
    </p>

    <div style="margin-top:1.25rem; padding-top:1.25rem; border-top:1px solid var(--border); text-align:center; font-size:0.85rem; color:var(--text-light);">
        <strong>Демо-аккаунт:</strong> demo / demo123
    </div>
</div>
{% endblock %}
